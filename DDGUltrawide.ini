; DDGUltrawide settings. Copy this file next to version.dll
; (TG4AC\Binaries\Win64). Anything left out uses the default shown here.
;
; The game renders its stock 3840x2160 frame exactly as on the cabinet (four
; 1920x1080 screens in a 2x2 grid), and the DLL redraws those screens into its
; own window in the layout below.

[Output]
; Size of the output window in pixels (normally your monitor's resolution).
Width=5120
Height=1440
; Position of the output window's top-left corner on the desktop.
X=0
Y=0
; Wait for vertical sync when showing each frame (avoids tearing).
VSync=1
; Snap screen edges to whole pixels (avoids seams between screens).
PixelSnap=1
; What to do with the game's own window:
;   0 = keep the output window above it
;   1 = move the game window off-screen (if 0 doesn't keep it hidden)
GameWindow=0

[Layout]
; 1 = arcade layout: the side screens are drawn smaller than the center, as on
; the cabinet (42" sides, 55" center), with all three sharing a flush bottom
; edge. The center screen is as large as fits. The touch panel goes centered
; under it at a third of the output's height, or in its own window with
; [TouchPanelWindow]. P0..P3 below and [Source] are ignored; the log shows the
; resulting layout.
; 0 = manual layout: each screen goes where P0..P3 and [Source] say.
ArcadeLayout=1
; Arcade layout only: draw the cabinet around the screens instead of black: its
; walls, the frame around each forward screen (rails, seams, fasteners and the Z
; bracket holding it to the wall), and the dark console under the center screen
; with the touch panel set into it. The frames touch, as on the cabinet.
; 1 = on, 0 = off.
ArcadeCabinet=1
; The cabinet's wall color, as hex RGB.
ArcadeCabinetColor=BAB3A5
; The cabinet is lit by the game's screens: their light falls on the frames and
; bounces off the booth around the player (walls and ceiling in the cabinet's
; color) back onto the cabinet, tinted by what's on screen. How strongly the
; screens light it (0 = not at all), and how much of the arcade's own lighting
; there is, relative to the defaults.
ArcadeCabinetScreenLight=1
ArcadeCabinetRoomLight=1
; Arcade layout only: the gap between neighboring forward screens, in inches on
; the cabinet (about 2"), scaled along with the screens. Not used with
; ArcadeCabinet, where the frames set the spacing. 0 = flush.
ArcadeGap=2
; Arcade layout only: with the touch panel in this window (TouchPanelWindow
; off): 1 = let the forward screens use the full width by drawing the touch
; panel over the bottom edge of the center screen.
ArcadeTouchPanelAllowOverlap=0
; Arcade layout only: with the touch panel in this window: the panel's size,
; relative to its normal height (a third of the output). Smaller values leave
; more room for the forward screens (with overlap off) or cover less of the
; center screen (with overlap on). On a 5120x1440 output, the default, 0.75,
; makes the center screen exactly 1920x1080 (the game's own native panel
; resolution) without the cabinet, or 1656x932 with it (the frames take room).
ArcadeTouchPanelScaling=0.75
; Manual layout only:
; Where each screen is drawn in the output: SizeX, SizeY, OriginX, OriginY,
; as fractions of the output. Fractions like 1/3 are allowed.
; P0..P2 = left, center, right window; P3 = touch panel.
; The panel is 1120x480 px, centered below: the matted-off bottom of the panel
; is cropped out in [Source], so the rest is drawn larger (see S3).
P0=1/3, 2/3, 0,    0
P1=1/3, 2/3, 1/3,  0
P2=1/3, 2/3, 2/3,  0
P3=1120/5120, 1/3, 2000/5120, 2/3

[Source]
; Where each screen is in the game's frame (same format and order as [Layout]).
; The cabinet's 2x2 grid: left = top-left, center = top-right,
; right = bottom-left, touch panel = bottom-right.
; The panel's bottom 258 of 1080 rows are covered by a matte on the cabinet, so
; only its top 822 rows are used. To show the whole panel, use
; S3=1/2, 1/2, 1/2, 1/2 with P3=1/6, 1/3, 5/12, 2/3.
S0=1/2, 1/2, 0,   0
S1=1/2, 1/2, 1/2, 0
S2=1/2, 1/2, 0,   1/2
S3=1/2, 822/2160, 1/2, 1/2

[TouchPanelWindow]
; Show the touch panel in its own window, full screen on a separate monitor
; (e.g. a touchscreen), instead of in the main output. P3/S3 above are then
; ignored and the settings below are used. 1 = on, 0 = off.
Enabled=0
; Which monitor: the number Windows shows for it in Settings > Display (the log
; lists every monitor with its number). 0 = the first monitor that isn't
; showing the main output.
Monitor=0
; Or place the window explicitly (desktop pixels); used when Width and Height
; are both set, overriding Monitor.
;X=5120
;Y=0
;Width=1920
;Height=1080
; Wait for vertical sync on this window too. Off by default so the two windows
; don't slow each other down (especially at different refresh rates).
VSync=0
; Where the panel is in the game's frame, and where it is drawn in this window
; (same format as [Source] and [Layout]). By default only the panel's used
; 1920x822 area is drawn (the rest is matted off on the cabinet), as large as
; fits in the window without stretching, centered. Uncomment to override, e.g.
; the whole 1920x1080 panel: Source=1/2, 1/2, 1/2, 1/2. Setting Layout turns off
; the automatic fit (1, 1, 0, 0 fills the window, stretching if needed).
;Source=1/2, 822/2160, 1/2, 1/2
;Layout=1, 1, 0, 0

[Touch]
; Forward mouse clicks on the output window to the game (the game treats mouse
; clicks as touches). 1 = on, 0 = off.
Enabled=1
; Which screens accept clicks, by index (comma-separated). On the cabinet only
; the touch panel (3) is touchable.
Screens=3
; Hide the mouse cursor over the output window (e.g. for a real touchscreen).
HideCursor=0

[Game]
; Size the game renders at. The DLL sets this (windowed) on the game's command
; line, replacing any resolution a launcher such as TeknoParrot puts there, so
; the game renders the cabinet's full-resolution 3840x2160 frame.
; 0 = leave the game's size alone.
RenderWidth=3840
RenderHeight=2160
; Extra options appended to the game's command line (normally not needed).
ExtraCommandLine=
