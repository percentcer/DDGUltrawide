; DDGUltrawide settings. Copy this file next to version.dll
; (TG4AC\Binaries\Win64).

[Mode]
; 1 = compositor: the game renders its stock 3840x2160 2x2 image (exactly as on
;     the cabinet) and the DLL rearranges the four screens into its own window.
; 0 = layout hooks: change the game's own layout and UI scale (experimental).
Compositor=1

[Display]
; Output size (the compositor window, normally your monitor's resolution).
Width=5120
Height=1440
; Snap screen edges to whole pixels (avoids 1px seams). 1 = on, 0 = off.
PixelSnap=1
; Extra options appended to the game's command line at startup.
; With TeknoParrot, set the game to 3840x2160 windowed in TeknoParrot instead.
; For launching the exe directly:
;   ExtraCommandLine=-ResX=3840 -ResY=2160 -windowed
ExtraCommandLine=

[Output]
; Where the output window goes on the desktop (top-left corner).
X=0
Y=0
; Wait for vertical sync when showing each frame (avoids tearing).
VSync=1
; What to do with the game's own window:
;   0 = keep the output window above it (the output window becomes "owned"
;       by the game window, which Windows always stacks above its owner)
;   1 = move the game window off-screen (try this if 0 doesn't work)
GameWindow=0

[Touch]
; Forward mouse clicks on the output window to the game (the game treats mouse
; clicks as touches). 1 = on, 0 = off.
Enabled=1
; Which screens accept clicks, by index (0..2 = left, center, right window,
; 3 = touch panel). Comma-separated. On the cabinet only the panel is touchable.
Screens=3
; Hide the mouse cursor over the output window (e.g. for a real touchscreen).
HideCursor=0

[Layout]
; Destination of each screen in the output, in order: SizeX, SizeY, OriginX,
; OriginY as fractions of the output. Fractions like 1/3 are allowed.
; P0..P2 = left, center, right window; P3 = touch panel.
P0=1/3, 2/3, 0,    0
P1=1/3, 2/3, 1/3,  0
P2=1/3, 2/3, 2/3,  0
P3=1/6, 1/3, 5/12, 2/3

[Source]
; Where each screen is in the game's own frame (same format). The stock layout
; is 2x2: left = top-left, center = top-right, right = bottom-left,
; panel = bottom-right.
S0=1/2, 1/2, 0,   0
S1=1/2, 1/2, 1/2, 0
S2=1/2, 1/2, 0,   1/2
S3=1/2, 1/2, 1/2, 1/2

[UI]
; Only used when Compositor=0.
FixScale=1
ReferencePlayer=0
DesignHeight=1080

[Addresses]
; Specific to TG4AC-Win64-Shipping.exe version 5.80.02. Only used when Compositor=0.
LayoutPlayersRVA=0x12D0470
DPIScaleRVA=0x15FA010
SplitscreenInfoOffset=0x60
ActiveSplitscreenTypeOffset=0x78
